name: GIB iOS Source Qualification

on:
  push:
    branches:
      - audit/gib-app-review-20261023
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    name: Validate GIB release candidate (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check the app
        run: npx tsc --noEmit --pretty false
      - name: Test release contract and CI isolation
        run: node --test tests/release-contract.test.cjs
      - name: Bundle iOS JavaScript (not an IPA)
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/gib-ios-export"
