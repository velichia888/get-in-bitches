workflows:
  ios-app-store:
    name: Get In Bitches - App Store Upload
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic MINR"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.getinbitches.app

      node: v22.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Detect workspace and scheme
        script: |
          WORKSPACE=$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          echo "CM_XCODE_WORKSPACE=$WORKSPACE" >> "$CM_ENV"
          echo "CM_XCODE_SCHEME=$SCHEME" >> "$CM_ENV"

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Apply App Store signing
        script: |
          xcode-project use-profiles

          /usr/bin/plutil -convert xml1 "$HOME/export_options.plist"

          /usr/bin/plutil \
            -replace method \
            -string app-store-connect \
            "$HOME/export_options.plist"

          echo "Validate export plist:"
          /usr/bin/plutil -lint "$HOME/export_options.plist"

          echo "Export method:"
          /usr/libexec/PlistBuddy \
            -c "Print :method" \
            "$HOME/export_options.plist"

      - name: Build signed IPA
        script: |
          set -euo pipefail

          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/GetInBitches.xcarchive"
          EXPORT_PATH="$CM_BUILD_DIR/build/ios/ipa"

          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          mkdir -p "$EXPORT_PATH"

          echo "Archiving $CM_XCODE_SCHEME..."

          xcodebuild \
            -workspace "$CM_XCODE_WORKSPACE" \
            -scheme "$CM_XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM=4357L599UW \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution"

          echo "Archive completed. Exporting IPA..."

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$HOME/export_options.plist"

          echo "Export complete:"
          ls -lah "$EXPORT_PATH"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
