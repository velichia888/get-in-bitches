workflows:
  ios-app-store:
    name: Get In Bitches - App Store Upload
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic MINR"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.getinbitches.app

      node: v22.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Detect workspace and scheme
        script: |
          WORKSPACE=$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          echo "CM_XCODE_WORKSPACE=$WORKSPACE" >> "$CM_ENV"
          echo "CM_XCODE_SCHEME=$SCHEME" >> "$CM_ENV"

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Apply App Store signing
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"method":"app-store-connect"}'

          EXPORT_METHOD=$(/usr/libexec/PlistBuddy -c "Print :method" "$HOME/export_options.plist")
          echo "Export method: $EXPORT_METHOD"

          if [ "$EXPORT_METHOD" != "app-store-connect" ]; then
            /usr/libexec/PlistBuddy \
              -c "Set :method app-store-connect" \
              "$HOME/export_options.plist"
          fi

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_XCODE_WORKSPACE" \
            --scheme "$CM_XCODE_SCHEME" \
            --export-options-plist "$HOME/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
