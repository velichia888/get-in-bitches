workflows:
  ios-app-store:
    name: Get In Bitches - App Store Upload
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic MINR"

    environment:
      groups:
        - minr_app_store
      node: v22.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Detect Xcode workspace and scheme
        script: |
          WORKSPACE=$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name "*.xcworkspace" | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No Xcode workspace found"
            exit 1
          fi

          SCHEME=$(xcodebuild \
            -workspace "$WORKSPACE" \
            -list \
            -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["workspace"]["schemes"][0])')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No Xcode scheme found"
            exit 1
          fi

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          echo "CM_XCODE_WORKSPACE=$WORKSPACE" >> "$CM_ENV"
          echo "CM_XCODE_SCHEME=$SCHEME" >> "$CM_ENV"

      - name: Initialize signing keychain
        script: |
          keychain initialize

      - name: Fetch or create App Store signing files
        script: |
          app-store-connect fetch-signing-files "app.getinbitches" \
            --type IOS_APP_STORE \
            --create

      - name: Install signing certificate
        script: |
          keychain add-certificates

      - name: Apply provisioning profile
        script: |
          xcode-project use-profiles

      - name: Build signed App Store IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_XCODE_WORKSPACE" \
            --scheme "$CM_XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
