workflows:
  ios-app-store:
    name: Get In Bitches - App Store Upload
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic MINR"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.getinbitches.app

      vars:
        BUNDLE_ID: com.getinbitches.app
        # get-latest-app-store-build-number needs the numeric App Store
        # Connect app id, not the bundle id - passing the bundle id 404s
        # ("no resource of type 'apps' with id 'com.getinbitches.app'")
        # and silently falls back to build number 1, colliding with any
        # build already uploaded.
        APP_STORE_CONNECT_APP_ID: "6806875083"
        # Public/anon-scoped Supabase config - safe to keep in plain vars
        # since access is governed by Row Level Security, not secrecy of
        # these values. EXPO_PUBLIC_ prefix makes Expo inline them into
        # the JS bundle at build time.
        EXPO_PUBLIC_SUPABASE_URL: https://xeyfdyzspspcmyrhqmnb.supabase.co
        EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_6CN0UloP5qGirRVds3QzlQ_W64esp7p

      node: v22.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Bump iOS build number
        script: |
          # app.json's ios.buildNumber was a static "2", which App Store
          # Connect had already seen (the rejected 2.1.0 submission) --
          # every upload needs a strictly higher CFBundleVersion, so pull
          # the last-accepted number and increment it instead of hardcoding.
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_CONNECT_APP_ID" || echo 0)
          # Floor of 2 regardless of what the lookup returns: build "2" is
          # already known to be live on App Store Connect (the rejected
          # placeholder submission), so no computed value should ever let
          # this dip below 3.
          if [ "$LATEST_BUILD_NUMBER" -lt 2 ]; then
            LATEST_BUILD_NUMBER=2
          fi
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Setting iOS build number to $NEW_BUILD_NUMBER"

          NEW_BUILD_NUMBER="$NEW_BUILD_NUMBER" node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            config.expo.ios.buildNumber = process.env.NEW_BUILD_NUMBER;
            fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          "

      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Detect workspace and scheme
        script: |
          WORKSPACE=$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          echo "CM_XCODE_WORKSPACE=$WORKSPACE" >> "$CM_ENV"
          echo "CM_XCODE_SCHEME=$SCHEME" >> "$CM_ENV"

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Apply App Store signing
        script: |
          xcode-project use-profiles

          /usr/bin/plutil -convert xml1 "$HOME/export_options.plist"

          /usr/bin/plutil \
            -replace method \
            -string app-store-connect \
            "$HOME/export_options.plist"

          echo "Validate export plist:"
          /usr/bin/plutil -lint "$HOME/export_options.plist"

          echo "Export method:"
          /usr/libexec/PlistBuddy \
            -c "Print :method" \
            "$HOME/export_options.plist"

      - name: Build signed IPA
        script: |
          set -euo pipefail

          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/GetInBitches.xcarchive"
          EXPORT_PATH="$CM_BUILD_DIR/build/ios/ipa"

          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          mkdir -p "$EXPORT_PATH"

          echo "Archiving $CM_XCODE_SCHEME..."

          xcodebuild \
            -workspace "$CM_XCODE_WORKSPACE" \
            -scheme "$CM_XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM=4357L599UW \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution"

          echo "Archive completed. Exporting IPA..."

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$HOME/export_options.plist"

          echo "Export complete:"
          ls -lah "$EXPORT_PATH"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
